name: Compatibility report
description: Tell others whether XDR Boost works on your Mac.
labels: [compatibility]
body:
  - type: markdown
    attributes:
      value: XDR Boost has been tested on one Mac so far. A report from yours tells the next owner of that model what to expect.
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: From Apple menu > About This Mac.
      placeholder: MacBook Pro 16-inch, M4 Max, 2024
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "26.7.2"
    validations:
      required: true
  - type: dropdown
    id: works
    attributes:
      label: Does it work?
      options:
        - Yes, the screen gets brighter
        - Partly (see notes)
        - No
    validations:
      required: true
  - type: input
    id: setting
    attributes:
      label: Slider setting you used
      placeholder: "1130"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Color shifts, flicker, heat, conflicts with other apps, anything else you noticed.
